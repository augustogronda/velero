<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Simulador Náutico de Viento y Maniobras 3D - Curso de Timonel (PNA)</title>

  <!-- PWA: Instalación como Web App -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0a172c" />

  <!-- iOS / iPadOS específico -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Náutico PNA" />
  <!-- Favicon e Iconos -->
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="shortcut icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <!-- SEO / descripción -->
  <meta name="description" content="Simulador interactivo 3D de viento, maniobras RIPA, boyado IALA B y fondeo para el Curso de Timonel PNA." />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sky-day: #7dd3fc;
      --panel-bg: rgba(10, 23, 44, 0.88);
      --panel-border: rgba(56, 189, 248, 0.32);
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --accent-emerald: #10b981;
      --accent-rose: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;

      /* Escala armónica de z-index */
      --z-canvas: 1;
      --z-cards: 40;
      --z-header: 50;
      --z-controls: 50;
      --z-env: 55;
      --z-hud-toggle: 60;
      --z-drawer: 100;
      --z-pwa-banner: 200;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    *:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--sky-day);
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      z-index: var(--z-canvas);
      overflow: hidden;
    }

    /* ── BARRA SUPERIOR ────────────────────────────────────────────── */
    .sim-header {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: 16px;
      right: 16px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      gap: 12px;
    }

    .sim-brand {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 6px 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .sim-badge {
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .sim-brand h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.15;
    }

    .sim-mode-selector {
      display: flex;
      gap: 4px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 3px;
      pointer-events: auto;
    }
    .mode-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .mode-tab:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.06);
    }
    .mode-tab.active {
      background: var(--accent-cyan);
      color: #030d1b;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .sim-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .sim-btn {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      color: #ffffff;
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
    }
    .sim-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      transform: translateY(-1px);
    }
    .sim-btn-night.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.5);
    }
    .sim-btn-link {
      color: var(--accent-gold);
      border-color: rgba(245, 158, 11, 0.4);
    }
    .sim-btn-link:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--accent-gold);
    }

    /* ── ROSA DE LOS VIENTOS (COMPASS) ────────────────────────────── */
    .sim-compass-card {
      position: fixed;
      top: max(80px, calc(env(safe-area-inset-top, 0px) + 74px));
      left: 16px;
      z-index: 40;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 12px;
      width: 220px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .compass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .compass-legend-tws {
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .compass-dial-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .compass-svg {
      width: 170px;
      height: 170px;
      overflow: visible;
    }
    .compass-ring-outer {
      fill: rgba(15, 23, 42, 0.6);
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1.5;
    }
    .compass-ring-inner {
      fill: none;
      stroke: rgba(56, 189, 248, 0.2);
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
    .compass-cardinal {
      fill: #e2e8f0;
      font-size: 13px;
      font-weight: 800;
      font-family: 'Space Grotesk', sans-serif;
    }
    .wind-arrow-line {
      stroke: #38bdf8;
      stroke-width: 3.5;
      stroke-linecap: round;
    }
    .wind-arrow-head {
      fill: #38bdf8;
    }
    .wind-arrow-label {
      fill: #38bdf8;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .boat-heading-line {
      stroke: #f59e0b;
      stroke-width: 3.5;
      stroke-linecap: round;
    }
    .boat-heading-head {
      fill: #f59e0b;
    }
    .boat-hull-icon {
      fill: rgba(245, 158, 11, 0.45);
      stroke: #f59e0b;
      stroke-width: 1.2;
    }
    .compass-subtext {
      font-size: 0.70rem;
      color: #cbd5e1;
      text-align: center;
      margin-top: 6px;
      line-height: 1.35;
    }
    .dot-wind { color: #38bdf8; }
    .dot-boat { color: #f59e0b; }

    /* ── TELEMETRÍA NÁUTICA ───────────────────────────────────────── */
    .sim-telemetry-card {
      position: fixed;
      top: max(80px, calc(env(safe-area-inset-top, 0px) + 74px));
      right: 16px;
      z-index: 40;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 14px 18px;
      width: 320px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tel-row-point {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
    .tel-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .tel-point-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .tel-point-badge.danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.45);
    }
    .tel-metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .metric-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .m-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
    }
    .m-unit {
      font-size: 0.60rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .tel-eval-box {
      font-size: 0.76rem;
      line-height: 1.4;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
    .tel-eval-box.eval-warning {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
      color: #fde047;
    }

    /* ── TARJETA RIPA ─────────────────────────────────────────────── */
    .sim-ripa-card {
      position: fixed;
      top: max(96px, calc(env(safe-area-inset-top, 0px) + 90px));
      right: 16px;
      z-index: 40;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 14px 16px;
      width: 380px;
      max-width: calc(100vw - 32px);
      max-height: calc(100dvh - 110px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ripa-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ripa-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .ripa-badge {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .ripa-nav-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ripa-nav-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.70rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .ripa-nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #ffffff;
      border-color: var(--accent-cyan);
    }
    .ripa-pills-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(56, 189, 248, 0.35) transparent;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .ripa-pill {
      flex: 0 0 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: #94a3b8;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Space Grotesk', sans-serif;
      scroll-snap-align: start;
    }
    .ripa-pill:hover {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
    }
    .ripa-pill.active {
      background: var(--accent-cyan);
      color: #030d1b;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .ripa-pill.completed {
      border-color: #10b981;
      color: #34d399;
    }
    .ripa-pill.completed.active {
      background: #10b981;
      color: #030d1b;
    }
    .ripa-tactical-banner {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      line-height: 1.35;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ripa-tactical-banner.role-privilegiado {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }
    .ripa-tactical-banner.role-cede_paso {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }
    .ripa-tactical-banner.role-ambos_maniobran {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
    }
    .ripa-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ffffff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      outline: none;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .ripa-select:focus,
    .ripa-select:focus-visible {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
    }
    .ripa-select option {
      background: #0f172a;
      color: #ffffff;
    }
    .ripa-desc {
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .ripa-quiz-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
    }
    .ripa-question {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--accent-cyan);
      line-height: 1.35;
    }
    .ripa-options-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ripa-opt-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      line-height: 1.35;
    }
    .ripa-opt-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
    }
    .ripa-opt-btn.opt-correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #6ee7b7;
    }
    .ripa-opt-btn.opt-wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .ripa-feedback {
      font-size: 0.76rem;
      line-height: 1.45;
      padding: 8px 10px;
      border-radius: 8px;
      display: none;
    }
    .ripa-feedback.feedback-correct {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .ripa-feedback.feedback-wrong {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* ── TARJETA IALA B ───────────────────────────────────────────── */
    .sim-iala-card {
      position: fixed;
      top: max(96px, calc(env(safe-area-inset-top, 0px) + 90px));
      right: 16px;
      z-index: 40;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 16px 18px;
      width: 360px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .iala-badge {
      font-size: 0.68rem;
      font-weight: 800;
      color: #34d399;
      letter-spacing: 0.06em;
    }
    .iala-motto {
      font-size: 0.78rem;
      line-height: 1.45;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
    .iala-buoy-pills {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .buoy-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.74rem;
      color: #e2e8f0;
      line-height: 1.35;
    }
    .buoy-pill.green { border-color: rgba(34, 197, 94, 0.4); }
    .buoy-pill.green .bp-icon { color: #22c55e; }
    .buoy-pill.red { border-color: rgba(239, 68, 68, 0.4); }
    .buoy-pill.red .bp-icon { color: #ef4444; }
    .buoy-pill.black { border-color: rgba(245, 158, 11, 0.4); }
    .buoy-pill.black .bp-icon { color: #fbbf24; }
    .buoy-pill.safe { border-color: rgba(56, 189, 248, 0.4); }
    .buoy-pill.safe .bp-icon { color: #38bdf8; }

    /* ── TARJETA FONDEO Y BORNEO ──────────────────────────────────── */
    .sim-anchor-card {
      position: fixed;
      top: max(96px, calc(env(safe-area-inset-top, 0px) + 90px));
      right: 16px;
      z-index: 40;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 14px 16px;
      width: 380px;
      max-width: calc(100vw - 32px);
      max-height: calc(100dvh - 110px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .anchor-badge {
      font-size: 0.68rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .anchor-status-banner {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .anchor-status-banner.danger {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .anchor-status-banner.warning {
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fde047;
    }
    .anchor-status-banner.success {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .anchor-scope-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 12px;
    }
    .scope-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
    }
    .scope-desc {
      font-size: 0.68rem;
      color: var(--text-muted);

    }
    .anchor-sliders-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .anchor-slider-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }
    .anchor-slider-row input[type="range"] {
      width: 100%;
      accent-color: var(--accent-cyan);
    }
    .anchor-advice {
      font-size: 0.74rem;
      line-height: 1.45;
      color: #94a3b8;
      background: rgba(255,255,255,0.02);
      border-left: 3px solid var(--accent-cyan);
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
    }

    /* ── TARJETA METEOROLOGÍA RIOPLATENSE ─────────────────────────── */
    .sim-weather-card {
      position: fixed;
      top: max(80px, calc(env(safe-area-inset-top, 0px) + 74px));
      right: 16px;
      z-index: 40;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 14px 16px;
      width: 380px;
      max-width: calc(100vw - 32px);
      max-height: calc(100dvh - 110px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .weather-badge {
      font-size: 0.68rem;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .weather-presets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .weather-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;

    }
    .weather-btn.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #fde047;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }
    .weather-metrics-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .w-metric {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .w-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }
    .w-lbl {
      font-size: 0.58rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .reefing-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
    }
    .reefing-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }
    .reefing-btn-group {
      display: flex;
      gap: 6px;
    }
    .reefing-btn {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      text-align: center;
    }
    .reefing-btn:hover {
      background: rgba(56, 189, 248, 0.2);
    }
    .reefing-btn.active {
      background: #10b981;
      color: #030d1b;
      border-color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
    .weather-desc-box {
      font-size: 0.74rem;
      line-height: 1.45;
      color: #cbd5e1;
    }

    /* ── PANEL INFERIOR DE MANIOBRAS ───────────────────────────────── */
    .sim-controls-panel {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      left: 16px;
      right: 16px;
      z-index: 50;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ctrl-row-presets {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .ctrl-group-title {
      font-size: 0.70rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .preset-btn-group {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-preset {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-preset:hover {
      border-color: var(--accent-cyan);
      color: #ffffff;
      background: rgba(56, 189, 248, 0.15);
    }
    .btn-preset.active {
      background: var(--accent-cyan);
      color: #030d1b;
      border-color: var(--accent-cyan);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .btn-auto-trim {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-gold);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.73rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      margin-left: auto;
    }
    .btn-auto-trim:hover {
      background: var(--accent-gold);
      color: #040914;
    }
    .btn-toggle-wind-lines {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent-cyan);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.73rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-toggle-wind-lines:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent-cyan);
      color: #ffffff;
    }
    .btn-toggle-wind-lines.active {
      background: var(--accent-cyan);
      color: #030d1b;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .ctrl-row-weather {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 6px;
    }
    .ctrl-row-weather::-webkit-scrollbar { display: none; }
    .ctrl-weather-btns, .ctrl-reef-btns {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-weather-quick {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: #cbd5e1;
      padding: 4px 9px;
      border-radius: 7px;
      font-size: 0.70rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-weather-quick:hover {
      border-color: var(--accent-gold);
      color: #ffffff;
      background: rgba(245, 158, 11, 0.15);
    }
    .btn-weather-quick.active {
      background: rgba(245, 158, 11, 0.25);
      border-color: #f59e0b;
      color: #fde047;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.35);
    }
    .btn-reef-quick {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 0.70rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-reef-quick:hover {
      border-color: #10b981;
      color: #ffffff;
    }
    .btn-reef-quick.active {
      background: #10b981;
      border-color: #10b981;
      color: #030d1b;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
    .weather-info-box {
      font-size: 0.73rem;
      line-height: 1.4;
      color: #cbd5e1;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--accent-gold);
      padding: 6px 10px;
      border-radius: 0 8px 8px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .btn-notes-toggle {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.73rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn-notes-toggle:hover {
      background: #10b981;
      color: #040914;
    }

    .ctrl-row-sliders {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      align-items: center;
    }
    .slider-card {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 6px 10px;
      border-radius: 9px;
    }
    .slider-card label {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .slider-card label strong {
      color: #ffffff;
    }
    .slider-card input[type="range"] {
      width: 100%;
      height: 4px;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    /* ── VENTANA FLOTANTE: AJUSTES DE LUZ Y AGUA ───────────────────── */
    .sim-env-card {
      position: fixed;
      top: max(80px, calc(env(safe-area-inset-top, 0px) + 74px));
      right: 16px;
      z-index: 55;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 16px 18px;
      width: 320px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: envFadeIn 0.2s ease-out;
    }
    @keyframes envFadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .env-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }
    .btn-env-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .btn-env-close:hover {
      color: #ffffff;
    }
    .env-card-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .env-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .env-section-title {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-gold);
    }
    .env-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .env-row label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }
    .env-row label strong {
      color: var(--accent-cyan);
    }
    .env-row input[type="range"] {
      width: 100%;
      height: 4px;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }
    .env-toggle-group {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .env-toggle-btn {
      flex: 1;
      padding: 5px 8px;
      font-size: 0.70rem;
      font-weight: 700;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .env-toggle-btn.active {
      background: var(--accent-cyan);
      color: #030d1b;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    /* ── CAJÓN DE APUNTES PNA ──────────────────────────────────────── */
    .sim-notes-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 420px;
      max-width: 90vw;
      height: 100%;
      background: rgba(8, 14, 28, 0.96);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-left: 1px solid var(--panel-border);
      z-index: 100;
      padding: max(20px, env(safe-area-inset-top, 20px)) 22px max(20px, env(safe-area-inset-bottom, 20px)) 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: -10px 0 40px rgba(0,0,0,0.7);
    }
    .sim-notes-drawer.open {
      transform: translateX(0);
    }
    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }
    .notes-header h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      color: var(--accent-cyan);
    }
    .btn-notes-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .notes-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 4px;
    }
    .note-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 12px;
    }
    .note-card h4 {
      font-size: 0.84rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .note-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .note-item strong {
      font-size: 0.74rem;
      color: #ffffff;
      display: block;
      margin-bottom: 2px;
    }
    .note-item p {
      font-size: 0.74rem;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-line;
    }

    /* ── ANIMACIÓN DE ENTRADA SUAVE PARA PANELES ─────────────────── */
    @keyframes panelEnter {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .panel-entering {
      animation: panelEnter 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ── BOTÓN OCULTAR/MOSTRAR HUD ────────────────────────────────── */
    #btn-toggle-hud.hud-off {
      background: rgba(16, 185, 129, 0.25);
      border-color: #10b981;
      color: #34d399;
    }

    body.hud-hidden #btn-toggle-hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      right: 16px;
      z-index: var(--z-hud-toggle);
      background: rgba(16, 185, 129, 0.35) !important;
      border: 1px solid #10b981 !important;
      color: #34d399 !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
    }

    body.hud-hidden .sim-header .sim-brand,
    body.hud-hidden .sim-header .sim-mode-selector,
    body.hud-hidden .sim-header .sim-header-actions button:not(#btn-toggle-hud),
    body.hud-hidden .sim-header .sim-header-actions a,
    body.hud-hidden .sim-compass-card,
    body.hud-hidden .sim-telemetry-card,
    body.hud-hidden .sim-controls-panel,
    body.hud-hidden .sim-ripa-card,
    body.hud-hidden .sim-anchor-card,
    body.hud-hidden .sim-iala-card {
      display: none !important;
    }

    /* ── MANIJA DEL DRAWER DE CONTROLES INFERIOR ────────────────────── */
    .ctrl-drawer-handle {
      display: none;
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 0 6px 0;
      user-select: none;
      touch-action: manipulation;
    }
    .drawer-pill {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.3);
      transition: background 0.2s;
    }
    .ctrl-drawer-handle:active .drawer-pill {
      background: var(--accent-cyan);
    }
    .drawer-bar-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      padding: 0 4px;
    }
    .dbi-badge {
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .dbi-val {
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.74rem;
    }
    .dbi-arrow {
      color: var(--accent-cyan);
      font-weight: 800;
      font-size: 0.75rem;
      transition: transform 0.25s ease;
    }

    .ctrl-drawer-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── ADAPTACIÓN RESPONSIVE (IPADS Y TABLETS) ───────────────────── */
    @media (max-width: 1024px) {
      .ctrl-row-sliders {
        grid-template-columns: repeat(3, 1fr);
      }
      .sim-telemetry-card {
        width: 270px;
      }
    }

    /* ── ADAPTACIÓN RESPONSIVE MOBILE (SMARTPHONES < 768px) ────────── */
    @media (max-width: 767px) {
      .sim-header {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        top: max(6px, env(safe-area-inset-top, 6px));
        left: 8px;
        right: 8px;
      }
      .sim-header-top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
      .sim-brand {
        padding: 5px 10px;
        border-radius: 10px;
      }
      .sim-badge {
        font-size: 0.52rem;
      }
      .sim-brand h1 {
        font-size: 0.86rem;
      }
      .sim-header-actions {
        gap: 4px;
      }
      .sim-btn {
        padding: 5px 8px;
        font-size: 0.70rem;
        border-radius: 8px;
      }
      .sim-btn .btn-text {
        display: none;
      }
      .sim-mode-selector {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        gap: 4px;
        padding: 3px;
        border-radius: 10px;
      }
      .sim-mode-selector::-webkit-scrollbar { display: none; }
      .mode-tab {
        padding: 5px 9px;
        font-size: 0.68rem;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* Widgets de rosa y telemetría compactos en esquinas superiores */
      .sim-compass-card {
        top: max(105px, calc(env(safe-area-inset-top, 0px) + 98px));
        bottom: auto;
        left: 8px;
        width: 105px;
        padding: 6px;
        border-radius: 12px;
      }
      .compass-header {
        font-size: 0.58rem;
        margin-bottom: 2px;
      }
      .compass-legend-tws {
        padding: 1px 4px;
        font-size: 0.58rem;
      }
      .compass-svg {
        width: 80px;
        height: 80px;
      }
      .compass-footer, .compass-subtext {
        display: none !important;
      }

      .sim-telemetry-card {
        top: max(105px, calc(env(safe-area-inset-top, 0px) + 98px));
        bottom: auto;
        right: 8px;
        width: 140px;
        padding: 6px 8px;
        border-radius: 12px;
        gap: 4px;
      }
      .tel-row-point {
        padding-bottom: 3px;
      }
      .tel-label {
        font-size: 0.56rem;
      }
      .tel-point-badge {
        font-size: 0.60rem;
        padding: 2px 4px;
      }
      .tel-metrics-grid {
        grid-template-columns: 1fr 1fr;
        gap: 3px;
      }
      .metric-box {
        padding: 3px;
        border-radius: 6px;
      }
      .m-val {
        font-size: 0.82rem;
      }
      .m-unit {
        font-size: 0.50rem;
      }
      .tel-eval-box {
        display: none !important;
      }

      /* Panel de control inferior: Bottom Sheet colapsable que deja libre el 3D */
      .ctrl-drawer-handle {
        display: flex;
      }
      .sim-controls-panel {
        left: 8px;
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom, 8px));
        padding: 6px 12px;
        border-radius: 16px;
        max-height: 48px;
        overflow: hidden;
        transition: max-height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
      }
      .sim-controls-panel.drawer-open {
        max-height: 60vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        box-shadow: 0 -12px 45px rgba(0,0,0,0.85);
      }
      .sim-controls-panel.drawer-open #dbi-arrow {
        transform: rotate(180deg);
      }

      .ctrl-row-sliders {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .slider-card {
        padding: 5px 8px;
      }
      .slider-card label {
        font-size: 0.62rem;
      }

      /* Tarjetas de modos y configuración dentro del viewport */
      .sim-ripa-card,
      .sim-anchor-card,
      .sim-iala-card,
      .sim-env-card {
        position: fixed;
        top: max(80px, calc(env(safe-area-inset-top, 0px) + 76px));
        left: 8px;
        right: 8px;
        width: calc(100% - 16px);
        max-height: calc(100dvh - 145px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 12px 14px;
        border-radius: 16px;
        z-index: 55;
      }
    }

    /* ══════════════════════════════════════════════════════════════════
       SISTEMA DE PANELES REDIMENSIONABLES — SNAP A 3 ESTADOS
       collapsed | normal | expanded
       ══════════════════════════════════════════════════════════════════ */

    /* Botones de control de tamaño en headers de panel */
    .panel-size-controls {
      display: flex;
      gap: 3px;
      align-items: center;
      margin-left: auto;
      flex-shrink: 0;
    }
    .panel-size-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #94a3b8;
      width: 22px;
      height: 22px;
      min-width: 22px !important;
      min-height: 22px !important;
      max-width: 22px;
      max-height: 22px;
      border-radius: 5px;
      font-size: 0.68rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-family: inherit;
      font-weight: 700;
      flex-shrink: 0;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .panel-size-btn:hover,
    .panel-size-btn:active {
      background: rgba(56,189,248,0.25);
      border-color: var(--accent-cyan);
      color: #ffffff;
    }
    .panel-size-btn.active-size {
      background: var(--accent-cyan);
      color: #030d1b;
      border-color: var(--accent-cyan);
    }

    /* ── Estados de Brújula ──────────────────────────────────────────── */
    .sim-compass-card {
      transition: width 0.3s cubic-bezier(0.2,0.8,0.2,1),
                  min-height 0.3s cubic-bezier(0.2,0.8,0.2,1),
                  opacity 0.2s ease;
      will-change: width, min-height;
      overflow: hidden;
      box-sizing: border-box;
      width: 230px;
    }
    .sim-compass-card .compass-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      width: 100%;
    }
    .compass-title {
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .compass-title-long {
      display: none;
    }
    @media (min-width: 1400px) {
      .sim-compass-card:not([data-size="collapsed"]) .compass-title-long {
        display: inline;
      }
    }
    .sim-compass-card[data-size="collapsed"] .compass-dial-container,
    .sim-compass-card[data-size="collapsed"] .compass-subtext {
      display: none !important;
    }
    .sim-compass-card[data-size="collapsed"] {
      width: 205px;
      padding: 8px 10px;
    }
    .sim-compass-card[data-size="expanded"] {
      width: 260px;
    }
    .sim-compass-card[data-size="expanded"] .compass-svg {
      width: 210px;
      height: 210px;
    }

    /* ── Estados de Telemetría ───────────────────────────────────────── */
    .sim-telemetry-card {
      transition: width 0.3s cubic-bezier(0.2,0.8,0.2,1),
                  opacity 0.2s ease;
      will-change: width;
      overflow: hidden;
    }
    .sim-telemetry-card .tel-header-row {
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
      margin-bottom: 2px;
    }
    .sim-telemetry-card[data-size="collapsed"] .tel-metrics-grid,
    .sim-telemetry-card[data-size="collapsed"] .tel-eval-box {
      display: none !important;
    }
    .sim-telemetry-card[data-size="collapsed"] {
      width: 215px;
      padding: 8px 12px;
    }
    .sim-telemetry-card[data-size="collapsed"] .tel-label {
      font-size: 0.68rem;
    }
    .sim-telemetry-card[data-size="collapsed"] .tel-point-badge {
      font-size: 0.76rem;
      padding: 2px 6px;
    }
    .sim-telemetry-card[data-size="expanded"] {
      width: 360px;
    }
    .sim-telemetry-card[data-size="expanded"] .tel-eval-box {
      display: block !important;
    }

    /* ── BANNER DE INSTALACIÓN PWA (iOS "Add to Home Screen") ────────── */
    .pwa-install-banner {
      position: fixed;
      bottom: max(90px, calc(env(safe-area-inset-bottom, 0px) + 86px));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 200;
      background: rgba(10, 23, 44, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(56,189,248,0.1);
      min-width: 320px;
      max-width: 420px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2,0.8,0.2,1);
    }
    .pwa-install-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .pwa-banner-icon {
      font-size: 2rem;
      flex-shrink: 0;
      line-height: 1;
    }
    .pwa-banner-text {
      flex: 1;
    }
    .pwa-banner-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
    }
    .pwa-banner-desc {
      font-size: 0.73rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .pwa-banner-desc strong {
      color: var(--accent-cyan);
    }
    .pwa-banner-close {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: all 0.15s;
    }
    .pwa-banner-close:hover {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
    }

    /* ══════════════════════════════════════════════════════════════════
       OPTIMIZACIÓN IPAD 9 — 768px–1024px (landscape: 1024×768 logical)
       Apple HIG: touch targets mínimo 44×44px
       ══════════════════════════════════════════════════════════════════ */
    @media (min-width: 768px) and (max-width: 1366px) {

      /* Header compacto en iPad/laptop para encajar holgadamente en 1 fila */
      .sim-header {
        align-items: center;
        gap: 6px;
        left: 10px;
        right: 10px;
      }
      .sim-brand {
        padding: 4px 8px;
        flex-shrink: 0;
      }
      .sim-brand h1 {
        font-size: 0.86rem;
      }
      .sim-badge {
        font-size: 0.52rem;
      }
      .sim-mode-selector {
        flex-shrink: 1;
        gap: 2px;
        padding: 2px;
      }
      .sim-header .mode-tab {
        min-height: 32px;
        padding: 4px 7px;
        font-size: 0.68rem;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .sim-header-actions {
        flex-shrink: 0;
        gap: 3px;
      }
      .sim-header .sim-btn {
        min-height: 32px;
        padding: 4px 7px;
        font-size: 0.68rem;
        border-radius: 8px;
        white-space: nowrap;
        gap: 3px;
      }
      .ripa-nav-btn {
        min-height: 44px;
        padding: 8px 14px;
        font-size: 0.76rem;
      }
      .ripa-opt-btn {
        min-height: 44px;
        padding: 10px 12px;
      }
      .btn-preset {
        min-height: 44px;
        padding: 8px 14px;
        font-size: 0.78rem;
      }
      .btn-weather-quick,
      .btn-reef-quick {
        min-height: 44px;
        padding: 8px 12px;
      }
      .ripa-pill {
        min-width: 44px;
        min-height: 44px;
        flex: 0 0 36px;
        height: 36px;
      }
      .weather-btn {
        min-height: 44px;
        padding: 10px 12px;
      }
      .reefing-btn {
        min-height: 44px;
      }
      input[type="range"] {
        height: 6px !important;
        cursor: pointer;
      }
      /* Slider thumb más grande para dedo */
      input[type="range"]::-webkit-slider-thumb {
        width: 24px;
        height: 24px;
      }

      /* Panel brújula: tamaño iPad */
      .sim-compass-card {
        width: 230px;
      }
      .compass-svg {
        width: 185px;
        height: 185px;
      }

      /* Panel telemetría: tamaño iPad */
      .sim-telemetry-card {
        width: 310px;
      }

      /* Métricas con más espacio */
      .m-val {
        font-size: 1.4rem;
      }
      .tel-label {
        font-size: 0.76rem;
      }

      /* Panel de controles inferior — dock inferior limpio sin franja muerta debajo */
      .sim-controls-panel {
        bottom: 0;
        left: 10px;
        right: 10px;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        padding: 10px 16px max(10px, env(safe-area-inset-bottom, 10px)) 16px;
      }
      .ctrl-row-sliders {
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }
      .slider-card {
        padding: 8px 12px;
      }
      .slider-card label {
        font-size: 0.72rem;
      }

      /* Cards laterales — ancho iPad */
      .sim-ripa-card,
      .sim-anchor-card,
      .sim-weather-card {
        width: 400px;
      }
      .sim-iala-card {
        width: 380px;
      }

      /* Fuentes más legibles en pantalla 10.2" */
      .ripa-question {
        font-size: 0.95rem;
      }
      .ripa-desc {
        font-size: 0.84rem;
        line-height: 1.5;
      }
      .anchor-advice {
        font-size: 0.80rem;
        line-height: 1.5;
      }

      /* Modo noche: título visible */
      .sim-btn .btn-text {
        display: inline;
      }

      /* Drawer de apuntes: más ancho en iPad */
      .sim-notes-drawer {
        width: 480px;
      }
    }

    /* ── iPad en portrait (768×1024) ────────────────────────────────── */
    @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
      .sim-header {
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 10px;
        top: max(10px, env(safe-area-inset-top, 10px));
        left: 12px;
        right: 12px;
      }
      .sim-brand {
        order: 1;
        flex: 0 0 auto;
        padding: 5px 12px;
      }
      .sim-brand h1 {
        font-size: 0.92rem;
      }
      .sim-badge {
        font-size: 0.58rem;
      }
      .sim-header-actions {
        order: 2;
        flex: 0 0 auto;
        margin-left: auto;
        gap: 5px;
      }
      .sim-header-actions .sim-btn {
        padding: 5px 8px;
        font-size: 0.72rem;
      }
      .sim-mode-selector {
        order: 3;
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 4px;
        padding: 3px;
      }
      .sim-mode-selector .mode-tab {
        flex: 1 1 auto;
        text-align: center;
        padding: 7px 6px;
        font-size: 0.72rem;
      }

      /* Widgets de rosa y telemetría debajo del header de 2 filas (sin solapamiento) */
      .sim-compass-card {
        width: 200px;
        top: max(112px, calc(env(safe-area-inset-top, 0px) + 106px));
      }
      .sim-telemetry-card {
        width: 260px;
        top: max(112px, calc(env(safe-area-inset-top, 0px) + 106px));
      }
      .ctrl-row-sliders {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* ── MODO PWA STANDALONE / FULLSCREEN (iPadOS / iOS / Android) ──── */
    @media all and (display-mode: standalone), (display-mode: fullscreen) {
      html, body {
        height: 100% !important;
        min-height: -webkit-fill-available !important;
      }
      #webgl-container {
        height: 100% !important;
        min-height: -webkit-fill-available !important;
      }
      .sim-controls-panel {
        bottom: 0;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
      }
    }
  </style>
</head>

  <div id="webgl-container"></div>
